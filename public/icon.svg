<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect x="0" y="0" width="512" height="512" rx="64" fill="#0f172a"/>

  <!-- browser window: the web/platform -->
  <rect x="86" y="120" width="340" height="280" rx="28"
        fill="none" stroke="#f1f5f9" stroke-width="14"/>
  <line x1="86" y1="176" x2="426" y2="176" stroke="#f1f5f9" stroke-width="8"/>
  <circle cx="118" cy="148" r="7" fill="#f1f5f9"/>
  <circle cx="146" cy="148" r="7" fill="#f1f5f9"/>
  <circle cx="174" cy="148" r="7" fill="#f1f5f9"/>

  <!-- typed text + caret: the text -->
  <line x1="128" y1="288" x2="228" y2="288" stroke="#f1f5f9" stroke-width="10" stroke-linecap="round"/>
  <rect x="238" y="270" width="8" height="36" fill="#f1f5f9"/>

  <!-- the text directly drives a function -->
  <path d="M270,288 L322,288 M310,276 L324,288 L310,300"
        fill="none" stroke="#f1f5f9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- function switched on -->
  <rect x="338" y="262" width="68" height="32" rx="16" fill="none" stroke="#f1f5f9" stroke-width="9"/>
  <circle cx="392" cy="278" r="13" fill="#f1f5f9"/>
</svg>
